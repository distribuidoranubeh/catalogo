  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
      user-select: none;
      text-align: center;
      margin: 0;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 22px;
    }

    a {
      display: block;
      margin: 10px auto;
      padding: 14px 16px;
      text-decoration: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #45a049;
    }

    a span {
      background-color: white;
      color: #4CAF50;
      border-radius: 50%;
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      margin-right: 8px;
      font-weight: bold;
    }

    .hora {
      font-size: 13px;
      color: #e0e0e0;
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      a {
        font-size: 16px;
        padding: 12px;
      }

      h2 {
        font-size: 18px;
      }

      a span {
        width: 22px;
        height: 22px;
        line-height: 22px;
        font-size: 14px;
      }

      .hora {
        font-size: 12px;
      }
    }
  </style>
</head>
