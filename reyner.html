    }

    a span {

    }

    .hora {
      font-size: 13px;
      color: #e0e0e0;
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      a {
        font-size: 16px;
        padding: 12px;
      }

      h2 {
        font-size: 18px;
      }

      a span {
        width: 22px;
        height: 22px;
        line-height: 22px;
        font-size: 14px;
      }

      .hora {
