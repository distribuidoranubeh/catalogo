  <style>
    body {
      font-family: Arial, sans-serif;

      margin: 0;
    }

    h2 {

    }

    a {
      display: block;

      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #45a049;
    }

    a span {
      background-color: white;
      color: #4CAF50;
      border-radius: 50%;
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      margin-right: 8px;
      font-weight: bold;
    }

    .hora {
      font-size: 13px;
      color: #e0e0e0;
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      a {
        font-size: 16px;
        padding: 12px;
      }

      h2 {
        font-size: 18px;
      }

      a span {
        width: 22px;
        height: 22px;
        line-height: 22px;
        font-size: 14px;
      }

      .hora {
        font-size: 12px;
      }
    }

</head>
