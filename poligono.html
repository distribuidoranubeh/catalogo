<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Buscador de Lugares por Polígono</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 90%; width: 100%; }
    #panel {
      padding: 10px;
      background: #fff;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="panel">
    <input id="keyword" type="text" placeholder="Ej: colmado, farmacia, restaurante..." size="40">
    <button onclick="buscar()">Buscar</button>
    <button onclick="descargar()">Descargar Excel</button>
  </div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script>
    let map, drawingManager, polygon = null;
    let lugares = [];
    let placeIds = new Set();

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 18.4861, lng: -69.9312 },
        zoom: 13,
      });

      drawingManager = new google.maps.drawing.DrawingManager({
        drawingMode: google.maps.drawing.OverlayType.POLYGON,
        drawingControl: true,
        drawingControlOptions: {
          position: google.maps.ControlPosition.TOP_CENTER,
          drawingModes: [google.maps.drawing.OverlayType.POLYGON],
        },
        polygonOptions: {
          fillColor: '#2196F3',
          fillOpacity: 0.4,
          strokeWeight: 2,
          clickable: false,
          editable: false,
          zIndex: 1
        }
      });

      drawingManager.setMap(map);

      google.maps.event.addListener(drawingManager, 'overlaycomplete', function(event) {
        if (polygon) polygon.setMap(null);
        polygon = event.overlay;
      });
    }

    async function buscar() {
      if (!polygon) return alert("Dibuja primero un área en el mapa.");
      const keyword = document.getElementById("keyword").value.trim();
      if (!keyword) return alert("Escribe una palabra clave.");

      lugares = [];
      placeIds.clear();

      const bounds = new google.maps.LatLngBounds();
      polygon.getPath().forEach(latlng => bounds.extend(latlng));

      const step = 0.0063; // ~700m
      const ne = bounds.getNorthEast();
      const sw = bounds.getSouthWest();

      for (let lat = sw.lat(); lat <= ne.lat(); lat += step) {
        for (let lng = sw.lng(); lng <= ne.lng(); lng += step) {
          const point = new google.maps.LatLng(lat, lng);
          if (google.maps.geometry.poly.containsLocation(point, polygon)) {
            await buscarEnPunto(point, keyword);
            await delay(1500); // espera entre puntos
          }
        }
      }

      alert("Búsqueda completada. Resultados: " + lugares.length);
    }

    async function buscarEnPunto(location, keyword) {
      let pagetoken = null;

      for (let i = 0; i < 3; i++) {
        const url = new URL("http://localhost:5000/places");
        url.search = new URLSearchParams({
          location: location.lat() + "," + location.lng(),
          radius: "1000",
          keyword: keyword,
          pagetoken: pagetoken || ""
        });

        try {
          const res = await fetch(url);
          const data = await res.json();

          if (data.results) {
            data.results.forEach(place => {
              if (!placeIds.has(place.place_id)) {
                lugares.push({
                  Nombre: place.name,
                  Latitud: place.geometry.location.lat,
                  Longitud: place.geometry.location.lng,
                  Place_ID: place.place_id,
                  Dirección: place.vicinity || ""
                });
                placeIds.add(place.place_id);
              }
            });
          }

          if (data.next_page_token) {
            pagetoken = data.next_page_token;
            await delay(2000);
          } else {
            break;
          }
        } catch (err) {
          console.error("Error llamando al proxy:", err);
          break;
        }
      }
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function descargar() {
      if (lugares.length === 0) return alert("No hay datos para exportar.");
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(lugares);
      XLSX.utils.book_append_sheet(wb, ws, "Lugares");
      XLSX.writeFile(wb, "lugares.xlsx");
    }
  </script>

  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDwTiHRZk6oss7tdNkt180yksAOd_sNuEs&libraries=drawing,geometry&callback=initMap">
  </script>
</body>
</html>
